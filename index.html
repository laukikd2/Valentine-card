<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For My Valentine ❤️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  font-family: Arial, sans-serif;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 360px;
}

h1 { color: #ff4d6d; }

.heart {
  font-size: 50px;
  animation: beat 1s infinite;
}

@keyframes beat {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.photos img {
  width: 90px;
  height: 90px;
  border-radius: 12px;
  margin: 5px;
  object-fit: cover;
}

button {
  padding: 10px 18px;
  margin: 8px;
  border: none;
  border-radius: 20px;
  font-size: 15px;
  cursor: pointer;
}

.yes { background: #ff4d6d; color: white; }
.no  { background: #ddd; position: relative; }
.play { background: #6c63ff; color: white; }

input { margin: 8px 0; }
</style>
</head>

<body>

<audio id="music" controls style="display:none;"></audio>

<div class="card" id="card">

  <!-- ✏️ PERSONALIZED TEXT -->
  <h1>Hey My Love ❤️</h1>
  <p>
    From random talks to endless smiles,<br>
    from small moments to big memories,<br>
    you’ve become my favourite part of every day 🥰
  </p>

  <div class="heart">💖</div>

  <!-- 🎵 YOUR SONG (SAFE METHOD) -->
  <p><b>Select our song 🎶</b></p>
  <input type="file" accept="audio/*" onchange="loadMusic(this)"><br>
  <button class="play" onclick="playMusic()">▶ Play Music</button>

  <!-- 📸 YOUR PHOTOS (SAFE METHOD) -->
  <p><b>Select our photos 📸</b></p>
  <input type="file" accept="image/*" multiple onchange="loadPhotos(this)">

  <div class="photos" id="photos"></div>

  <h3>Will you be my Valentine? 💌</h3>

  <button class="yes" onclick="yesClick()">Yes 💕</button>
  <button class="no" id="noBtn" onmouseover="moveNo()">No 🙈</button>
</div>

<script>
function loadMusic(input) {
  var music = document.getElementById("music");
  music.src = URL.createObjectURL(input.files[0]);
}

function playMusic() {
  document.getElementById("music").play();
}

function loadPhotos(input) {
  var container = document.getElementById("photos");
  container.innerHTML = "";
  for (var i = 0; i < input.files.length && i < 3; i++) {
    var img = document.createElement("img");
    img.src = URL.createObjectURL(input.files[i]);
    container.appendChild(img);
  }
}

function yesClick() {
  document.getElementById("card").innerHTML =
    "<h1>Yayyy 💘</h1>" +
    "<p>You just made my heart so happy ❤️<br>" +
    "I can’t wait to make this Valentine’s Day special with you 🥰</p>" +
    "<div class='heart'>😍</div>";
}

function moveNo() {
  var btn = document.getElementById("noBtn");
  var x = Math.floor(Math.random() * 160) - 80;
  var y = Math.floor(Math.random() * 160) - 80;
  btn.style.transform = "translate(" + x + "px," + y + "px)";
}
</script>

</body>
</html>
